  const nq = $("#newsQ"); if (nq) nq.oninput = () => { S.filters.q = nq.value; clearTimeout(render.t); render.t = setTimeout(() => { render(); const el = $("#newsQ"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
  view.querySelectorAll("[data-like]").forEach(b => b.onclick = async () => {
    if (!S.user) return openLogin("login");
    const id = +b.dataset.like, on = S.likes.has(id);
    const r = on ? await sb.from("news_likes").delete().eq("news_id", id).eq("user_id", S.user.id) : await sb.from("news_likes").insert({ news_id: id, user_id: S.user.id });
    if (r.error) return toast(r.error.message);
    on ? S.likes.delete(id) : S.likes.add(id); S.likeCount[id] = (S.likeCount[id] || 0) + (on ? -1 : 1); render();
  });
  view.querySelectorAll("[data-share]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(location.origin + location.pathname + "#news"); toast("Link copiado"); } catch { toast(location.origin + location.pathname + "#news"); } });
  const lo = $("#logoutBtn"); if (lo) lo.onclick = async () => { await sb.auth.signOut(); S.area = null; S.tab = "news"; toast("Você saiu"); };
  const pw = $("#pwBtn"); if (pw) pw.onclick = () => openLogin("reset");
  const nf = $("#newsForm"); if (nf) nf.onsubmit = async e => { e.preventDefault(); const { error } = await sb.from("news").insert({ event_id: S.event.id, title: $("#nTitle").value.trim(), kind: $("#nKind").value, content: $("#nBody").value.trim() || null, image_url: $("#nImg").value.trim() || null }); if (error) return $("#nErr").textContent = error.message; toast("Notícia publicada"); await refresh(); S.area = null; S.tab = "news"; render(); };
  ({ jogadores: mountPlayers, escalacoes: mountLineups, painel: mountPainel, org_atletas: mountAthletes, org_acessos: mountAccess, org_arbitros: mountEscala, inscricoes: mountClubRegs, clube_painel: mountClubPanel, clube_atletas: mountClubAthletes, clube_capitaes: mountClubCaptains, org_grade: mountGrade, org_inscricoes: mountOrgRegs, org_chaves: mountChaves, arbitragem: () => mountReferee("arbitragem"), ref_aceites: () => mountReferee("ref_aceites"), ref_quadra: () => mountReferee("ref_quadra") })[key]?.();
}

async function refresh() { await loadEventData(); render(); }

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { S.area = null; S.filters = {}; S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); });
$("#menuBtn").onclick = openDrawer;
$("#refreshBtn").onclick = async () => { await refresh(); toast("Dados atualizados"); };
$("#eventBtn").onclick = () => openSheet(sheetHead("Eventos", "Trocar evento") + `<div class="stack">${S.events.map(e => `<button class="card click" style="text-align:left" data-ev="${e.id}" ${S.event?.id === e.id ? 'aria-current="true"' : ""}><b>${esc(e.name)}</b><div class="small muted">${esc(e.city || "")} · ${fmtDate(e.starts_on + "T12:00")} a ${fmtDate(e.ends_on + "T12:00")}</div></button>`).join("")}</div>`, sheet => {
  sheet.querySelectorAll("[data-ev]").forEach(b => b.onclick = async () => { S.event = S.events.find(e => e.id === +b.dataset.ev); store.set("ic:event", S.event.slug); closeSheet(); S.area = null; await loadSession((await sb.auth.getSession()).data.session); await refresh(); });
});

/* ============ inicialização ============ */
(async function boot() {
  const view = $("#view");
  view.innerHTML = `<div class="empty">Carregando o evento…</div>`;
  try {
    await loadEvents();
    await loadEventData();
    await loadSession((await sb.auth.getSession()).data.session);
    const h = location.hash.slice(1);
    if (VIEWS[h] && ["chaves", "agenda", "resultados", "ranking", "news"].includes(h)) S.tab = h;
    render();
  } catch (e) {
    view.innerHTML = `<h1>Interclubes</h1><div class="empty">Não foi possível carregar os dados agora. Verifique a conexão e toque em atualizar.<br><span class="small">${esc(e.message || e)}</span></div>`;
  }
  sb.auth.onAuthStateChange(async (ev, session) => {
    if (ev === "PASSWORD_RECOVERY") { openLogin("reset"); }
    if (["SIGNED_IN", "SIGNED_OUT", "USER_UPDATED"].includes(ev)) { await loadSession(session); render(); }
  });
  S.live = sb.channel("live").on("postgres_changes", { event: "*", schema: "public", table: "matches" }, payload => {
    const m = payload.new; if (!m || m.event_id !== S.event?.id) return;
    const i = S.matches.findIndex(x => x.id === m.id); if (i >= 0) S.matches[i] = m; else S.matches.push(m);
    if (!$("#layer").innerHTML) render();
  }).on("postgres_changes", { event: "*", schema: "public", table: "match_games" }, payload => {
    const g = payload.new; if (!g) return;
    const i = S.games.findIndex(x => x.id === g.id); if (i >= 0) S.games[i] = g; else if (S.matches.some(m => m.id === g.match_id)) S.games.push(g);
    if (!$("#layer").innerHTML) render();
  }).subscribe();
})();
</script>
</body>
